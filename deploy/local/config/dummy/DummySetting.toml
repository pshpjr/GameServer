[Base]
IP = "172.29.26.10"
Port = 11333
useDB = false
startAccount = 0
# 브라우저 클라이언트 확인용: 목표 100명, 계정 0..99.
maxPlayer = 100
playerPerGroup = 100
reconnectTime = 3000

[permil]
loopMs = 100
moveRange = 6400
moveOffset = 300
# 몬스터가 보일 때 타겟으로 잡을 확률(‰). 몬스터가 나타날 때마다 굴립니다.
setTarget = 1000

[interval]
# 행동별 평균 간격(초). loopMs마다 loopMs ÷ 간격 확률로 굴리고, 0이면 하지 않습니다.
# toField·toVillage·fieldChange·chat은 전투 중에도 일어납니다.
# 레벨 이동 간격은 실제 게임에 가깝게 잡았습니다(필드 이동 5분, 마을 귀환 10분). DB 큐 한계를 보는 스트레스 시험이면 fieldChange = 5, toVillage = 10, toField = 5로 줄입니다.
move = 0.25
chat = 4
# 필드 → 다른 필드
fieldChange = 300
# 필드 → 마을
toVillage = 600
# 마을 → 필드
toField = 300

[session]
# 접속 한 번의 길이(초). 접속할 때마다 로그정규분포로 뽑고, 지나면 끊고 reconnectTime 뒤 다시 접속합니다.
# 기본값은 리니지 II 서버 측정 논문(서울대 MMLAB, NetGames) 값입니다: 중앙값 26분, 평균 183분. median = 0이면 끊지 않습니다.
median = 1560
mean = 10980
