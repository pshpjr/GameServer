name: portfolio26-local
services:
  mysql:
    image: ${MYSQL_IMAGE}
    build:
      context: ../mysql
    env_file: [mysql.env, monitoring.env]
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./config/mysql.cnf:/config/mysql.cnf:ro
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'test "$$(MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" mydb -Nse "SELECT COUNT(*) FROM player WHERE AccountNo=10000")" = 1'
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [local]
  gameserver:
    image: ${GAMESERVER_IMAGE}
    security_opt:
      - seccomp=./seccomp-io-uring.json
    build:
      context: ../..
      target: local-gameserver
      cache_from:
        - type=registry,ref=ghcr.io/pshpjr/gameserver:buildcache-dev
      args:
        BUILD_PRESET: ${BUILD_PRESET}
        VCPKG_CACHE_IMAGE: ${VCPKG_CACHE_IMAGE:-toolchain}
        NETLIB_ENABLE_OTEL: ${NETLIB_ENABLE_OTEL:-OFF}
        NETLIB_ENABLE_TRACY: ${NETLIB_ENABLE_TRACY:-OFF}
    working_dir: /runtime
    #  메트릭의 instance 라벨(HOSTNAME)이 컨테이너를 다시 만들어도 바뀌지 않게 고정한다.
    hostname: gameserver
    environment:
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    volumes:
      - ./config/server/GameSettings.toml:/runtime/GameSettings.toml:ro
      - ./config/server/serverSetting.toml:/runtime/serverSetting.toml:ro
    ports:
      - "127.0.0.1:${GAME_PORT}:11333"
      #  Tracy 클라이언트(on-demand). NETLIB_ENABLE_TRACY=ON 빌드에서만 연결을 받는다.
      - "127.0.0.1:${TRACY_PORT:-8086}:8086"
    networks:
      local:
        ipv4_address: 172.29.26.10
    stop_grace_period: 60s
  dummy:
    image: ${DUMMY_IMAGE}
    security_opt:
      - seccomp=./seccomp-io-uring.json
    build:
      context: ../..
      target: local-dummy
      cache_from:
        - type=registry,ref=ghcr.io/pshpjr/gameserver:buildcache-dev
      args:
        BUILD_PRESET: ${BUILD_PRESET}
        VCPKG_CACHE_IMAGE: ${VCPKG_CACHE_IMAGE:-toolchain}
        NETLIB_ENABLE_OTEL: ${NETLIB_ENABLE_OTEL:-OFF}
        NETLIB_ENABLE_TRACY: ${NETLIB_ENABLE_TRACY:-OFF}
    working_dir: /runtime
    #  hostname을 고정하지 않는다. 여러 개 띄우면 컨테이너 ID가 instance 라벨이 되어 서로 갈라진다.
    environment:
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    volumes:
      - ./config/dummy/DummySetting.toml:/runtime/DummySetting.toml:ro
      - ../../Dummy/chatData.txt:/runtime/chatData.txt:ro
    networks: [local]
    stop_grace_period: 30s
  #  두 번째 더미. dummy와 같은 이미지를 쓰고, 계정이 겹치지 않게 설정 파일만 다르다.
  dummy2:
    image: ${DUMMY_IMAGE}
    security_opt:
      - seccomp=./seccomp-io-uring.json
    working_dir: /runtime
    environment:
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    volumes:
      - ./config/dummy/DummySetting2.toml:/runtime/DummySetting.toml:ro
      - ../../Dummy/chatData.txt:/runtime/chatData.txt:ro
    networks: [local]
    stop_grace_period: 30s
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    command: ["--config=/etc/otelcol/config.yaml"]
    env_file: monitoring.env
    #  docker_stats receiver가 Docker 소켓(root:root 660)을 읽도록 root 그룹만 더한다.
    #  소켓은 Docker API 전체에 접근할 수 있으므로 로컬 테스트에서만 쓴다.
    group_add: ["0"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${OTLP_HTTP_PORT}:4318"
    networks: [local]
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    networks: [local]
  grafana:
    image: ${GRAFANA_IMAGE}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    networks: [local]
networks:
  local:
    ipam:
      config:
        - subnet: 172.29.26.0/24
volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
