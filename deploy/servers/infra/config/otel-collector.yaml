#  서버 배포용(인프라 단일 컨테이너 안). deploy/local/config/otel-collector.yaml에서 주소만 바꾸고 docker_stats는 뺐다.
#  OTLP/HTTP로 받아 Prometheus의 OTLP 수신 경로로 넘긴다.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

  #  MySQL 상태 값을 직접 읽는다. 계정은 monitoring.env에서 온다.
  mysql:
    endpoint: 127.0.0.1:3306
    username: ${env:MYSQL_MONITOR_USER}
    password: ${env:MYSQL_MONITOR_PASSWORD}
    collection_interval: 10s
    #  기본으로 꺼져 있는 것 중 서버 부하를 보는 데 필요한 것만 켠다.
    metrics:
      mysql.connection.count:
        enabled: true
      mysql.connection.errors:
        enabled: true
      mysql.max_used_connections:
        enabled: true
      mysql.query.count:
        enabled: true
      mysql.query.slow.count:
        enabled: true
      mysql.commands:
        enabled: true
      mysql.client.network.io:
        enabled: true

  #  호스트 디스크 지연·사용률. /proc/diskstats만 읽어서 비용이 거의 없다.
  #  컨테이너 안에서도 /proc/diskstats는 호스트 전체를 보여준다. 스파이크(수십 초)를 잡도록 5초 주기로 읽는다.
  host_metrics:
    collection_interval: 5s
    scrapers:
      disk:
        include:
          devices: [sda]
          match_type: strict

processors:
  batch: {}

  #  Prometheus에서 job="host"로 보이게 한다.
  resource/host:
    attributes:
      - key: service.name
        value: host
        action: upsert

  #  Prometheus에서 job="mysql"로 보이게 한다.
  resource/mysql:
    attributes:
      - key: service.name
        value: mysql
        action: upsert

exporters:
  otlphttp/prometheus:
    metrics_endpoint: http://127.0.0.1:9090/api/v1/otlp/v1/metrics
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/prometheus]
    metrics/mysql:
      receivers: [mysql]
      processors: [resource/mysql, batch]
      exporters: [otlphttp/prometheus]
    metrics/host:
      receivers: [host_metrics]
      processors: [resource/host, batch]
      exporters: [otlphttp/prometheus]
