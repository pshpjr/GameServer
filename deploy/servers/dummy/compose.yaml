# 더미(192.168.1.3). 서버의 ~/portfolio26/dummy에 이 파일과 config/가 놓인다.
# 더미 하나가 1,000명이다. dummy2는 계정 범위만 다르다(startAccount 1000).
name: portfolio26-dummy
x-dummy: &dummy
  image: ${DUMMY_IMAGE}
  network_mode: host
  security_opt:
    - seccomp=../seccomp-io-uring.json
  working_dir: /runtime
  #  세션마다 소켓 하나. 호스트 기본 nofile(1024)로는 2,000명을 받지 못한다.
  ulimits:
    nofile: 65536
  environment:
    OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://${INFRA_HOST}:4318/v1/metrics
  stop_grace_period: 30s
services:
  dummy:
    <<: *dummy
    #  호스트 네트워크라 HOSTNAME이 호스트 이름으로 같아진다. 메트릭 instance 라벨이 겹치지 않게 따로 준다.
    environment:
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://${INFRA_HOST}:4318/v1/metrics
      HOSTNAME: dummy1
    volumes:
      - ./config/DummySetting.toml:/runtime/DummySetting.toml:ro
      - ./config/chatData.txt:/runtime/chatData.txt:ro
      - ../data/dummy1/logs:/runtime/logs
  dummy2:
    <<: *dummy
    environment:
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://${INFRA_HOST}:4318/v1/metrics
      HOSTNAME: dummy2
    volumes:
      - ./config/DummySetting2.toml:/runtime/DummySetting.toml:ro
      - ./config/chatData.txt:/runtime/chatData.txt:ro
      - ../data/dummy2/logs:/runtime/logs
